name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    # Set the RUNS_ON repository variable (a JSON array) to change the runner.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    strategy:
      matrix:
        # PRs test the newest Node only; main tests both supported versions.
        node: ${{ github.event_name == 'pull_request' && fromJSON('[22]') || fromJSON('[20, 22]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  forbidden-strings:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The list lives on the runner and is never printed.
      - run: |
          list="$HOME/.config/demo-kit/forbidden-strings.txt"
          test -s "$list" || { echo "forbidden-strings list missing on runner"; exit 1; }
          hits=$(git log -p --all | grep -cF -f "$list" || true)
          files=$(grep -rlF -f "$list" --exclude-dir=node_modules --exclude-dir=.git . | wc -l | tr -d ' ')
          echo "history hits: $hits, tree files: $files"
          test "$hits" = "0" && test "$files" = "0"
  secrets:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: PATH="/opt/homebrew/bin:$PATH" gitleaks detect --source . --redact -v
